<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urban Sunset</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #1a1a1a;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    #canvas-container {
      position: relative;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <main>
    <div id="canvas-container">
      <canvas id="sunset-canvas"></canvas>
    </div>
  </main>
  <script src="sketch.js"></script>
</body>
</html>
