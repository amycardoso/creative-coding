<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entropia</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; background-color: #efe7da;
    }
    main { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    #canvas-container { box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); }
    @media (max-width: 800px) {
      main, #canvas-container { width: 100%; }
      #canvas-container canvas { display: block; width: 100% !important; height: auto !important; }
    }
  </style>
</head>
<body>
  <main>
    <div id="canvas-container"></div>
  </main>
  <script src="sketch.js"></script>
</body>
</html>
