<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desmate - Amazon Deforestation Visualization</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="container">
    <div class="sidebar">
      <header class="header">
        <h1 class="title">Desmate</h1>
        <p class="subtitle" id="header-subtitle">Loading deforestation data...</p>
      </header>

      <div class="controls">
        <div class="year-display">
          <span id="year-label">1988</span>
        </div>
        <input
          type="range"
          id="year-slider"
          min="1988"
          max="2026"
          value="1988"
          step="1"
        >
        <button id="play-btn" onclick="togglePlay()">
          <span id="play-icon">▶</span> Play
        </button>
        <button id="record-btn" onclick="toggleRecording()">
          <span id="record-icon">⬤</span> Record GIF
        </button>
      </div>

      <div id="stats-display" class="stats-display"></div>
      <div id="data-status" class="data-status"></div>

      <div class="sidebar-footer">
        <p>Data: <a href="https://firms.modaps.eosdis.nasa.gov/" target="_blank">NASA FIRMS</a> | <a href="http://terrabrasilis.dpi.inpe.br/" target="_blank">INPE TerraBrasilis</a> | <a href="http://www.obt.inpe.br/OBT/assuntos/programas/amazonia/prodes" target="_blank">PRODES</a></p>
        <button id="refresh-btn" onclick="refreshData()" class="refresh-btn">Refresh Live Data</button>
      </div>
    </div>

    <div class="canvas-area">
      <div id="canvas-container">
        <div id="loading-overlay" class="loading-overlay">
          <div class="loading-spinner"></div>
          <p id="loading-text">Loading...</p>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
