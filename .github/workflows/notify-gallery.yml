name: Notify Gallery

on:
  push:
    branches: [main]
    paths:
      - "manifest.json"
      - "**/**.gif"
      - "**/**.png"
      - "**/**.jpg"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GALLERY_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'amycardoso',
              repo: 'creative-coding-gallery',
              event_type: 'artwork-updated',
            });
