<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethereal Silhouette - Audio Reactive Particles</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0f;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    canvas {
      display: block;
    }

    #controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 100;
    }

    .btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 12px 24px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .btn.active {
      background: rgba(255, 180, 100, 0.3);
      border-color: rgba(255, 180, 100, 0.6);
    }

    #file-input {
      display: none;
    }

    #info {
      position: fixed;
      top: 20px;
      left: 20px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      z-index: 100;
    }

    #audio-info {
      position: fixed;
      top: 20px;
      right: 20px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      z-index: 100;
      text-align: right;
    }
  </style>
</head>
<body>
  <div id="info">
    Ethereal Silhouette<br>
    Press S to save PNG
  </div>

  <div id="audio-info">
    Load audio or enable microphone
  </div>

  <div id="controls">
    <input type="file" id="file-input" accept="audio/*">
    <button class="btn" id="load-btn">Load Audio</button>
    <button class="btn" id="mic-btn">Enable Mic</button>
    <button class="btn" id="play-btn" style="display: none;">Play</button>
  </div>

  <script src="sketch.js"></script>
</body>
</html>
